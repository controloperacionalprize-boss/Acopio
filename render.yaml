services:
  - type: web
    name: acopio-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: MSAL_CACHE_DIR
        value: /opt/render/.cache/Acopio
      - key: CORS_ORIGINS
        sync: false
